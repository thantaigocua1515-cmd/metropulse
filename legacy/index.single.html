class AudioEngine {
 constructor(){this.enabled=true;this.context=null}
 unlock(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!this.context&&Audio)this.context=new Audio();if(this.context?.state==="suspended")this.context.resume().catch(()=>{});}catch(_){}}
 play(kind){
  const c=this.context;if(!this.enabled||!c||c.state!=="running")return;
  const score={click:[[440,0,.07,"sine"]],build:[[135,0,.18,"triangle"],[260,.04,.12,"sine"]],money:[[530,0,.12],[670,.08,.12],[795,.16,.19]],level:[[392,0,.17],[523,.08,.2],[659,.16,.2],[784,.24,.32]],alarm:[[450,0,.16,"triangle"],[580,.23,.18,"triangle"]],repair:[[740,0,.18],[990,.10,.25]]};
  for(const [frequency,delay,length,wave="sine"] of score[kind]||[]){
   const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=wave;o.frequency.value=frequency;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(kind==="click"?.025:.085,t+.014);g.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(g).connect(c.destination);o.start(t);o.stop(t+length+.01);
  }
 }
}

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const coord=(x,y)=>y*CONFIG.size+x;
const steps=[[1,0],[-1,0],[0,1],[0,-1]];
const inside=(x,y)=>x>=0&&y>=0&&x<16&&y<16;
const distance=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const unlocked=(w,x,y)=>inside(x,y)&&x>=8-w.unlockedRadius&&x<8+w.unlockedRadius&&y>=8-w.unlockedRadius&&y<8+w.unlockedRadius;
const lookup=(w,x,y)=>inside(x,y)?w.index.get(coord(x,y)):undefined;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>new Date().toLocaleDateString("sv-SE");
const fmt=(v,d=0)=>Number(v).toLocaleString("vi-VN",{maximumFractionDigits:d,minimumFractionDigits:d});
const timer=v=>Math.ceil(Math.max(0,v)/60)+ " phút";
const htm=value=>String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const makeBuilding=(id,x,y,level=1,left=0)=>({id,x,y,level,left,total:left,age:0,crew:1,teamLevel:1});
const makeWorld=(buildings=[],level=1,rest={})=>({gridSize:16,unlockedRadius:CONFIG.radius(level),timeOfDay:.30,weather:"sunny",weatherClock:0,activePolicy:null,policyCooldowns:{},npcs:[],crises:[],crisisClock:0,speedBuff:0,immunity:0,happyDelta:0,...rest,buildings,index:new Map(buildings.map(b=>[coord(b.x,b.y),b]))});

class IsoMath {
 static gridToScreen(x,y,c){return {x:(x-y)*CONFIG.tileW/2*c.zoom+c.x,y:(x+y)*CONFIG.tileH/2*c.zoom+c.y}}
 static screenToGrid(x,y,c){
  const a=(x-c.x)/(CONFIG.tileW/2*c.zoom),b=(y-c.y)/(CONFIG.tileH/2*c.zoom);
  return {x:Math.floor((a+b)/2+1e-9),y:Math.floor((b-a)/2+1e-9)};
 }
}

class Pathfinding {
 static route(w,start,goal){
  if(!unlocked(w,start.x,start.y)||!unlocked(w,goal.x,goal.y))return null;
  const startKey=coord(start.x,start.y),end=coord(goal.x,goal.y),cost=new Float64Array(256).fill(Infinity),parent=new Int16Array(256).fill(-1);
  let open=[{key:startKey,g:0,f:distance(start,goal)}];cost[startKey]=0;
  while(open.length){
   open.sort((a,b)=>b.f-a.f||a.g-b.g);const {key,g}=open.pop();if(g!==cost[key])continue;
   if(key===end){
    const path=[];for(let k=end;k!==-1;k=parent[k])path.push({x:k%16,y:k>>4});
    return {path:path.reverse(),cost:g,offroad:path.some((p,i)=>i>0&&i<path.length-1&&!lookup(w,p.x,p.y))};
   }
   for(const [dx,dy] of steps){
    const x=key%16+dx,y=(key>>4)+dy;if(!unlocked(w,x,y))continue;
    const k=coord(x,y),b=lookup(w,x,y);if(k!==end&&b&&b.id!=="road")continue;
    const next=g+(b?1:4);if(next>=cost[k])continue;cost[k]=next;parent[k]=key;
    open.push({key:k,g:next,f:next+distance({x,y},goal)});
   }
  }
  return null;
 }
}

class SimulationEngine {
 constructor(data,audio){
  this.audio=audio;this.profile=data.profile;this.world=makeWorld(data.world.buildings,this.profile.level,data.world);
  this.milestones=data.milestones;this.stats=this.milestones.stats;this.particles=[];this.news=[];this.elapsed=0;this.metrics=this.measure(this.world);this.storage=null;
 }
 active(w=this.world){return w.buildings.filter(b=>b.left<=0)}
 count(id,w=this.world){return this.active(w).filter(b=>b.id===id).length}
 roadChain(){
  const visited=new Set();let best=0;
  for(const b of this.active())if(b.id==="road"&&!visited.has(b)){
   const stack=[b];visited.add(b);let n=0;
   while(stack.length){const r=stack.pop();n++;for(const [dx,dy] of steps){const next=lookup(this.world,r.x+dx,r.y+dy);if(next?.id==="road"&&!visited.has(next)){visited.add(next);stack.push(next)}}}
   best=Math.max(best,n);
  }return best;
 }
 measure(w,level=this.profile.level){
  const m={ps:0,pd:0,ws:0,wd:0,waste:0,pop:0,happiness:100,commerce:0,roads:0,income:0,level,construction:0};
  const has=id=>w.crises.some(c=>c.id===id),policy=w.activePolicy?.id;
  let earnings=0,wonder=false;
  for(const b of w.buildings){
   if(b.left>0){m.construction++;continue}
   const d=CONFIG.buildings[b.id],prod=this.production(b,w);
   if(d.power>0)m.ps+=d.power;else m.pd-=d.power;
   if(d.water>0)m.ws+=d.water;else m.wd-=d.water;
   m.waste+=d.waste*(d.waste>0&&policy==="festival"?2:1);m.pop+=d.pop;
   m.happiness+=d.happy;m.commerce+=d.group==="com"?1:0;m.roads+=b.id==="road"?1:0;
   earnings+=prod;wonder||=b.id==="metro_wonder";
  }
  m.happiness=clamp((m.happiness+w.happyDelta-(has("trash_pile")?10:0)-(has("flu_outbreak")?8:0))*(policy==="green"?1.2:1),20,150);
  const globalPenalty=Math.max(.1,w.crises.reduce((f,c)=>f*(c.id==="flu_outbreak"?.75:1),1));
  m.income=(CONFIG.baseIncome+earnings)*m.happiness/100*globalPenalty*(policy==="festival"?1.5:1)*(wonder?1.2:1);
  return m;
 }
 production(b,w){
  if(b.left>0||w.crises.some(c=>c.id==="fire"&&distance(c,b)===0))return 0;
  if((b.id==="office_tower"||b.id==="tech_tower")&&w.crises.some(c=>c.id==="cyber_attack"))return 0;
  const d=CONFIG.buildings[b.id],factor=w.crises.reduce((f,c)=>f*(c.id==="blackout"&&distance(c,b)<=1?.5:c.id==="traffic_jam"&&d.group==="com"?.7:1),1);
  return d.income*CONFIG.scale(b.level)*Math.max(.1,factor);
 }
 say(message){this.news.unshift(message);this.news.length=Math.min(12,this.news.length)}
 float(x,y,text,color="#d1fb8b"){this.particles.push({x,y,text,color,life:0})}
 gainXP(amount){
  const p=this.profile;p.xp+=amount;
  while(p.xp>=CONFIG.xpNext(p.level)){
   p.xp-=CONFIG.xpNext(p.level);p.level++;p.coins+=150*p.level;p.prestige+=5;this.world.unlockedRadius=CONFIG.radius(p.level);
   this.audio.play("level");this.say("Bản tin đặc biệt: "+p.mayorName+" đã đưa thành phố lên cấp "+p.level+"!");
  }
 }
 placement(id,x,y,existing=null){
  const w=this.world,d=CONFIG.buildings[id];
  if(!d)return "Chưa chọn bản vẽ.";
  if(!unlocked(w,x,y))return "Đất chưa mở khóa. Hãy lên cấp để mở rộng.";
  if(lookup(w,x,y))return "Ô này đã có công trình.";
  if(this.profile.level<d.unlock)return "Bản vẽ mở ở cấp "+d.unlock+".";
  if(!existing&&this.profile.coins<d.price)return "Không đủ Vàng.";
  if(w.crises.some(c=>c.id==="blackout"&&distance(c,{x,y})<=1))return "Không thể xây cạnh khu vực mất điện.";
  return "";
 }
 build(id,x,y){
  const error=this.placement(id,x,y);if(error)return error;
  const d=CONFIG.buildings[id],b=makeBuilding(id,x,y,1,d.duration);this.profile.coins-=d.price;
  this.world.buildings.push(b);this.world.index.set(coord(x,y),b);this.audio.play("build");
  if(b.left===0)this.finish(b);
  this.storage.save();return "";
 }
 finish(b){
  b.left=0;this.stats.buildingsBuilt++;if(b.id==="road")this.stats.roadsBuilt++;
  const d=CONFIG.buildings[b.id],xp=d.group==="res"&&this.world.crises.some(c=>c.id==="trash_pile")?0:d.xp;
  if(xp){this.gainXP(xp);this.float(b.x,b.y,"+"+xp+" XP")}
  if(b.id!=="road")this.say(d.name+" đã chính thức đi vào hoạt động.");
 }
 upgrade(b){
  if(b.left>0)return "Hãy chờ xây xong.";
  if(b.level>=CONFIG.maxLevel)return "Công trình đã đạt cấp tối đa.";
  const price=CONFIG.upgrade(b);if(this.profile.coins<price)return "Không đủ Vàng.";
  this.profile.coins-=price;b.level++;if(!(CONFIG.buildings[b.id].group==="res"&&this.world.crises.some(c=>c.id==="trash_pile")))this.gainXP(20*b.level);
  this.audio.play("build");this.float(b.x,b.y,"Cấp "+b.level);this.storage.save();return "";
 }
 accelerate(b){
  if(b.left<=0)return "Công trình đã hoàn thành.";
  if(this.world.crises.some(c=>c.id==="collapse"&&distance(c,b)===0))return "Cần sửa sự cố trước khi tăng tốc.";
  if(this.profile.prestige<1)return "Cần 1 Điểm Uy tín.";
  this.profile.prestige--;this.finish(b);this.audio.play("build");this.storage.save();return "";
 }
 canAlter(b){return !this.world.crises.some(c=>distance(c,b)===0)&&!this.world.npcs.some(n=>distance(n.home,b)===0)&&!this.social?.friends().some(f=>f.world.npcs.some(n=>n.assist&&distance(n.source,b)===0))}
 demolish(b){
  if(!this.canAlter(b))return "Không thể phá khi đang có sự cố hoặc đội đang làm nhiệm vụ.";
  this.profile.coins+=CONFIG.buildings[b.id].price*.5;this.world.buildings.splice(this.world.buildings.indexOf(b),1);this.world.index.delete(coord(b.x,b.y));this.audio.play("build");this.storage.save();return "";
 }
 move(b,x,y){
  if(!this.canAlter(b))return "Không thể di chuyển khi đang có sự cố hoặc đội đang làm nhiệm vụ.";
  const error=this.placement(b.id,x,y,b);if(error)return error;
  this.world.index.delete(coord(b.x,b.y));b.x=x;b.y=y;this.world.index.set(coord(x,y),b);this.storage.save();return "";
 }
 activate(id){
  const w=this.world,p=CONFIG.policies[id];if(w.activePolicy)return "Đang có sắc lệnh hiệu lực.";
  if(w.policyCooldowns[id]>0)return "Sắc lệnh đang hồi.";
  if(this.profile.prestige<p.cost)return "Không đủ Điểm Uy tín.";
  this.profile.prestige-=p.cost;w.activePolicy={id,left:p.duration};this.stats.policies++;this.say("Thị trưởng vừa ban hành sắc lệnh: "+p.name+".");this.storage.save();return "";
 }
 claim(id){
  const m=CONFIG.milestones.find(item=>item.id===id);if(!m||!this.milestones.completedIds.includes(id)||this.milestones.claimedIds.includes(id))return;
  this.milestones.claimedIds.push(id);this.profile.coins+=m.coins;this.profile.prestige+=m.prestige;this.gainXP(m.xp);this.audio.play("money");this.storage.save();
 }
 refreshMilestones(){
  this.stats.peakIncome=Math.max(this.stats.peakIncome,this.metrics.income);
  for(const m of CONFIG.milestones)if(!this.milestones.completedIds.includes(m.id)&&m.test(this))this.milestones.completedIds.push(m.id);
 }
 tick(dt){
  const w=this.world;this.elapsed+=dt;w.timeOfDay=(w.timeOfDay+dt/180)%1;w.weatherClock+=dt;
  if(w.weatherClock>=90){
   w.weatherClock-=90;let order=["sunny","heat","storm"];w.weather=order[(order.indexOf(w.weather)+1)%3];
   this.say({storm:"Mưa bão đang thử thách hệ thống lưới điện.",heat:"Nắng gắt! Cư dân nhắc nhau để ý đường ống và nguồn nhiệt.",sunny:"Trời quang, phố phường lại rộn ràng."}[w.weather]);
  }
  for(const id of Object.keys(w.policyCooldowns))w.policyCooldowns[id]=Math.max(0,w.policyCooldowns[id]-dt);
  if(w.activePolicy&&(w.activePolicy.left-=dt)<=0){w.policyCooldowns[w.activePolicy.id]=CONFIG.policies[w.activePolicy.id].cooldown;w.activePolicy=null}
  w.speedBuff=Math.max(0,w.speedBuff-dt);w.immunity=Math.max(0,w.immunity-dt);
  if(!w.crises.some(c=>c.id==="water_leak"))w.happyDelta-=Math.sign(w.happyDelta)*Math.min(Math.abs(w.happyDelta),dt*.035);
  const speed=(this.count("construction_hq")?.9:1)*(w.activePolicy?.id==="overtime"?.65:1);
  for(const b of w.buildings){
   if(b.left<=0){b.age+=dt;continue}
   if(w.crises.some(c=>c.id==="collapse"&&distance(c,b)===0))continue;
   b.left-=dt/speed;if(b.left<=0)this.finish(b);
  }
  this.metrics=this.measure(w);this.profile.coins+=this.metrics.income*dt;this.profile.happiness=this.metrics.happiness;
  if(!this.stats.news500&&this.metrics.income>=500){this.stats.news500=true;this.say(this.profile.mayorName+" vừa vượt mốc 500 Vàng/giây!")}
  this.crisis.tickOwn(dt);this.social.tick(dt);
  this.particles=this.particles.filter(p=>(p.life+=dt)<1.45);
 }
 start(renderer,ui){
  let last=performance.now(),hud=1,save=0,mission=1;
  const frame=now=>{
   const dt=clamp((now-last)/1000,0,.1);last=now;this.tick(dt);renderer.render(dt);
   hud+=dt;save+=dt;mission+=dt;if(mission>=.8){this.refreshMilestones();mission=0}if(hud>=.18){ui.refresh();hud=0}if(save>=5){this.storage.save();save=0}
   requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
 }
}
class CrisisAndNPCManager {
 constructor(sim){this.sim=sim}
 candidates(w,m){
  const live=w.buildings.filter(b=>b.left<=0&&b.id!=="road"),work=w.buildings.filter(b=>b.left>0);
  const homes=live.filter(b=>CONFIG.buildings[b.id].group==="res"),commercial=live.filter(b=>CONFIG.buildings[b.id].group==="com");
  const industry=live.filter(b=>CONFIG.buildings[b.id].group==="com"||["power_plant","waste_plant","tech_tower","trade_port"].includes(b.id));
  const net=live.filter(b=>["office_tower","tech_tower"].includes(b.id));
  const sunny=w.weather==="heat",storm=w.weather==="storm",p=w.activePolicy?.id;
  const supply=id=>this.sim.count(id,w)>0;
  return [
   ["blackout",(m.ps<m.pd?.37:0)+(storm?.22:0),live.filter(b=>CONFIG.buildings[b.id].power<0), (p==="overtime"?1.25:1)*(supply("solar_plant")?.55:1)],
   ["water_leak",(m.ws<m.wd?.37:0)+(sunny?.25:0),live.filter(b=>CONFIG.buildings[b.id].water<0),1],
   ["collapse",work.length?.15+Math.min(.14,work.length*.035)+(storm?.18:0)+(p==="overtime"?.1:0):0,work,p==="overtime"?1.25:1],
   ["traffic_jam",m.commerce>=2&&m.roads/Math.max(1,live.length)<.9?.31:0,w.buildings.filter(b=>b.id==="road"&&commercial.some(c=>distance(c,b)<=1)).concat(commercial),supply("police_station")?.65:1],
   ["fire",(industry.some(b=>b.age>45)?.17:0)+(sunny?.21:0),industry.length?industry:live,supply("fire_station")?.63:1],
   ["trash_pile",m.pop>=40&&m.waste>15?.34:0,homes,1],
   ["flu_outbreak",m.level>=5&&!w.immunity&&(m.happiness<85||m.waste>15)?.26:0,homes,supply("hospital")?.55:1],
   ["cyber_attack",net.length&&m.level>=7?.24:0,net,supply("cyber_hub")?.65:1]
  ].map(([id,risk,targets,factor])=>({id,risk:risk*factor*(p==="green"?.5:1),targets}));
 }
 spawn(w,id,target,notify){
  if(!target||w.crises.some(c=>distance(c,target)===0))return false;
  const c={id,uid:uid(),x:target.x,y:target.y,age:0,progress:0,spread:false,late:false};
  w.crises.push(c);if(notify){this.sim.say(CONFIG.crises[id].news);this.sim.audio.play("alarm");this.sim.storage?.save()}return true;
 }
 roll(w,m){
  if(w.crises.length>=3||w.buildings.filter(b=>b.id!=="road").length<3)return;
  const choices=this.candidates(w,m).filter(z=>z.risk>0&&m.level>=CONFIG.buildings[CONFIG.crises[z.id].hq].unlock&&!w.crises.some(c=>c.id===z.id));
  for(const z of choices.sort((a,b)=>b.risk-a.risk)){
   if(Math.random()>=z.risk)continue;
   const options=z.targets.filter(b=>!w.crises.some(c=>distance(c,b)===0));
   if(this.spawn(w,z.id,options[Math.floor(Math.random()*options.length)],true))break;
  }
 }
 friendRoll(friend,initial=false){
  const w=friend.world,m=this.sim.measure(w,friend.level);
  const goal=initial&&friend.level<=6?1:2;
  const relaxed=[{id:"blackout",targets:w.buildings.filter(b=>b.id!=="road"&&b.id!=="power_plant")},{id:"water_leak",targets:w.buildings.filter(b=>b.id!=="road"&&b.id!=="water_tower")}];
  const variants=this.candidates(w,m).filter(z=>z.risk>0&&CONFIG.buildings[CONFIG.crises[z.id].hq].unlock<=friend.level).concat(relaxed);
  const order=initial?[relaxed[friend.level%2],...variants.filter(z=>z.id!==relaxed[friend.level%2].id)]:variants.sort((a,b)=>String(a.id).localeCompare(b.id));
  const start=initial?0:Math.floor(Math.random()*order.length);
  for(let i=0;i<order.length&&w.crises.length<goal;i++){
   const z=order[(i+start)%order.length];if(w.crises.some(c=>c.id===z.id))continue;
   const options=z.targets.filter(b=>!w.crises.some(c=>distance(c,b)===0));

  const s=this.sim,d=CONFIG.crises[c.id];if(!w.crises.includes(c))return "Sự cố đã được xử lý.";
  if(w.npcs.some(n=>n.target===c.uid&&n.phase!=="return"))return "Đội đang xử lý sự cố này.";
  if(friend){s.social.resetQuota();if(s.profile.dailyHelpsLeft<=0)return "Đã hết 5 lượt chi viện hôm nay."}
  const all=this.teams(d.hq),free=all.filter(b=>this.busy(b)<b.crew);
  if(!all.length)return "Cần xây "+CONFIG.buildings[d.hq].name+" để điều phối "+d.npc+"!";
  if(!free.length)return "Tất cả nhân sự của đội đang làm nhiệm vụ.";
  const homes=friend?[
   ...w.buildings.filter(b=>b.id===d.hq&&b.left<=0),
   ...w.buildings.filter(b=>b.id==="road"&&steps.filter(([dx,dy])=>lookup(w,b.x+dx,b.y+dy)?.id==="road").length===1),
   ...w.buildings.filter(b=>b.id==="road")
  ]:free;
  let routes=homes.map(home=>({home,route:Pathfinding.route(w,home,c)})).filter(p=>p.route);
  if(friend&&!routes.length){
   const entry=w.buildings.filter(b=>b.id!=="road"&&distance(b,c)>0).filter(b=>steps.some(([dx,dy])=>unlocked(w,b.x+dx,b.y+dy)&&!lookup(w,b.x+dx,b.y+dy)));
   routes=entry.map(home=>({home,route:Pathfinding.route(w,home,c)})).filter(p=>p.route);
  }
  if(!routes.length)return "Không có lối đến sự cố. Hãy mở đường hoặc di chuyển công trình.";
  if(friend&&routes.some(r=>r.home.id===d.hq))routes=routes.filter(r=>r.home.id===d.hq);
  else if(friend&&routes.some(r=>distance(r.home,c)>1))routes=routes.filter(r=>distance(r.home,c)>1);
  routes.sort((a,b)=>a.route.cost-b.route.cost||distance(a.home,c)-distance(b.home,c));
  const {home,route}=routes[0],source=friend?free.sort((a,b)=>b.teamLevel-a.teamLevel)[0]:home;
  w.npcs.push({type:d.hq,assist:!!friend,source:{x:source.x,y:source.y},home:{x:home.x,y:home.y},level:source.teamLevel,target:c.uid,
   phase:"out",path:route.path,segment:0,part:0,x:home.x,y:home.y,repair:0});
  if(friend)s.profile.dailyHelpsLeft--;
  s.storage.save();return route.offroad?"Đã điều phối · Thiếu đường nối, đội di chuyển chậm.":"Đã điều phối "+d.npc+".";
 }
 teamAction(b,what){
  const s=this.sim;
  if(!CONFIG.npcs[b.id]||b.left>0)return "Trụ sở chưa hoạt động.";
  if(what==="hire"){
   if(b.crew>=3)return "Đội đã đủ 3 người.";
   const cost=b.crew+1;if(s.profile.prestige<cost)return "Không đủ Điểm Uy tín.";
   s.profile.prestige-=cost;b.crew++;
  }else{
   if(b.teamLevel>=5)return "Phương tiện đã đạt cấp tối đa.";
   const cost=250*b.teamLevel**1.4;if(s.profile.coins<Math.ceil(cost))return "Không đủ Vàng.";
   s.profile.coins-=Math.ceil(cost);b.teamLevel++;s.stats.npcLevel=Math.max(s.stats.npcLevel,b.teamLevel);
  }s.audio.play("level");s.storage.save();return "";

  const s=this.sim,p=s.profile,d=CONFIG.crises[c.id];
  w.crises.splice(w.crises.indexOf(c),1);
  let xp=d.xp,coins=d.coins,rep=d.prestige;
  if(friend){
   const factor=s.count("trade_port")?1.25:1;
   xp=40*factor;coins=250*friend.level*factor;rep=2*factor;p.helpsGiven++;
   s.say("Đội chi viện đã giúp "+friend.name+" xử lý "+d.name.toLowerCase()+"!");
  }else{
   if(!c.late){p.combo++;if(p.combo%3===0)rep++;if(p.combo>=3)xp=Math.round(xp*1.2)}
   const b=lookup(w,c.x,c.y);
   if(c.id==="water_leak")w.happyDelta=Math.min(50,w.happyDelta+8);
   if(c.id==="collapse"&&b){if(c.late)p.coins-=CONFIG.buildings[b.id].price*.1;b.left*=.8}
   if(c.id==="traffic_jam")w.speedBuff=30;
   if(c.id==="flu_outbreak")w.immunity=180;
   s.stats.crisesSolved++;s.say(d.name+" đã được xử lý."+(!c.late&&p.combo>=2?" Chuỗi phản ứng nhanh ×"+p.combo+"!":""));
  }

   const first=s.particles.length;s.float(c.x,c.y,"+"+xp+" XP");if(coins)s.float(c.x+.18,c.y+.7,"+"+fmt(coins)+" Vàng","#ffe08f");

  const point=n.path[n.segment],next=Pathfinding.route(w,point,n.phase==="return"?n.home:c);

 advance(n,w,dt,c){
  let budget=dt,attempts=0;
  while(budget>1e-6&&n.segment<n.path.length-1&&attempts++<6){
   const a=n.path[n.segment],b=n.path[n.segment+1],tile=lookup(w,b.x,b.y),end=n.segment===n.path.length-2;
   if(!end&&tile&&tile.id!=="road"){
    if(!this.reRoute(n,w,c))n.blocked=true;
    else n.blocked=false;
    return;
   }
   n.blocked=false;
   const jam=w.crises.some(z=>z.id==="traffic_jam"&&distance(z,b)===0&&n.target!==z.uid);
   const speed=CONFIG.vehicles[n.level-1].speed*(tile&&(tile.id==="road"||end)?1:.3)*(jam?.4:1)*(this.sim.world.speedBuff>0?1.25:1);
   const used=Math.min(budget,(1-n.part)/speed);budget-=used;n.part+=used*speed;

  for(const c of [...w.crises]){
   const d=CONFIG.crises[c.id],before=c.age;c.age+=dt;
   if(!c.late&&c.age>=d.danger){c.late=true;if(!friend)this.sim.profile.combo=0}
   if(!friend&&c.id==="water_leak"&&Math.floor(before/5)!==Math.floor(c.age/5))w.happyDelta=Math.max(-130,w.happyDelta-2);
   if(c.id==="fire"&&!c.spread&&c.age>=45&&w.crises.length<3){
    c.spread=true;
    const adjacent=steps.map(([dx,dy])=>lookup(w,c.x+dx,c.y+dy)).filter(b=>b&&b.id!=="road"&&!w.crises.some(z=>distance(z,b)===0));
    if(adjacent.length&&Math.random()<.72)this.spawn(w,"fire",adjacent[Math.floor(Math.random()*adjacent.length)],!friend);
   }
  }
  for(const n of [...w.npcs]){
   const c=w.crises.find(c=>c.uid===n.target);
   if(n.phase==="out"&&c){
    this.advance(n,w,dt,c);
    if(n.segment===n.path.length-1)n.phase="repair";
   }else if(n.phase==="repair"&&c){
    n.repair+=dt;c.progress=clamp(n.repair/CONFIG.vehicles[n.level-1].repair,0,1);
    if(c.progress>=1){
     n.phase="return";const route=Pathfinding.route(w,c,n.home);n.path=route?.path||[{x:c.x,y:c.y}];n.segment=0;n.part=0;
     this.resolve(c,w,friend);
    }
   }else if(n.phase==="return"){
    if(n.path.length===1&&distance(n,n.home)>0){n.blocked=!this.reRoute(n,w,null);continue}
    this.advance(n,w,dt,null);
    if(n.segment===n.path.length-1)w.npcs.splice(w.npcs.indexOf(n),1);
   }else w.npcs.splice(w.npcs.indexOf(n),1);
  }
 }
 tickOwn(dt){
  const {world:w,metrics:m}=this.sim;
  if((w.crisisClock+=dt)>=CONFIG.crisisInterval){w.crisisClock-=CONFIG.crisisInterval;this.roll(w,m)}
  this.tickWorld(w,dt);
 }
}

class SocialStorageAdapter {
 constructor(data){this.records=data}
 list(){return this.records}
 add(friend){if(this.records.some(f=>f.id===friend.id))throw Error("Thành phố này đã có trong danh sách.");if(this.records.length>=50)throw Error("Danh sách đã đủ 50 thành phố.");this.records.push(friend)}
 static code(data){
  const bytes=new TextEncoder().encode(JSON.stringify(data));let binary="";
  for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary);
 }
 static decode(code){
  if(typeof code!=="string"||code.length>28000||!(/^[a-zA-Z0-9+/]+={0,2}$/.test(code)))throw Error("Mã Base64 không hợp lệ.");
  try{return JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(Uint8Array.from(atob(code),ch=>ch.charCodeAt(0))))}
  catch(_){throw Error("Không đọc được mã thành phố. Hãy sao chép lại mã đầy đủ.")}
 }
}

class SocialManager {
 constructor(sim,saved){
  this.sim=sim;this.adapter=new SocialStorageAdapter(saved.length?saved.map(f=>({...f,world:makeWorld(f.world.buildings,f.level,f.world)})):this.samples());
  this.current=null;this.viewMode="own";
  for(const f of this.friends())if(!f.seeded){this.sim.crisis.friendRoll(f,true);f.seeded=true}
 }

 samples(){
  const profiles=[
   ["An Nhiên",3,7400,108,4,6,7],["Minh Khôi",5,19800,117,8,8,6],
   ["Hải Vân",7,38500,125,13,7,8],["Gia Linh",9,71200,133,18,9,7],["Thiên Lam",12,135000,144,27,8,9]
  ];
  return profiles.map(([name,level,coins,happiness,helpsGiven,row,col],i)=>{
   const r=CONFIG.radius(level),lo=8-r,hi=7+r,buildings=[],taken=new Set();
   const put=(id,x,y)=>{const k=coord(x,y);if(x<lo||x>hi||y<lo||y>hi||taken.has(k))return;taken.add(k);const b=makeBuilding(id,x,y);b.age=100;buildings.push(b)};
   for(let x=lo+1;x<=hi-1;x++)put("road",x,row);
   for(let y=lo+1;y<=hi-1;y++)put("road",col,y);
   if(level>=7)for(let x=col-4;x<=col+3;x++)put("road",x,row+3);
   const slots=[];
   for(const b of [...buildings])for(const [dx,dy] of steps){
    const x=b.x+dx,y=b.y+dy;
    if(x<lo||x>hi||y<lo||y>hi||taken.has(coord(x,y))||slots.some(s=>s.x===x&&s.y===y))continue;
    slots.push({x,y});
   }
   slots.sort((a,b)=>distance(a,{x:col,y:row})-distance(b,{x:col,y:row})||((a.x*13+a.y*17+i*11)%19)-((b.x*13+b.y*17+i*11)%19));
   const common=["house_small","power_plant","water_tower","mini_mart","house_small","apartment","fire_station"];
   const advanced=["night_market","police_station","park","construction_hq","hospital","waste_plant","office_tower","solar_plant","mall","cyber_hub","tech_tower","trade_port","metro_wonder"];
   const layout=[...common,...advanced.filter(id=>CONFIG.buildings[id].unlock<=level),...Array.from({length:i+1},(_,j)=>["house_small","apartment","mini_mart","water_tower"][(i+j)%4])];
   layout.forEach((id,j)=>{if(slots[j])put(id,slots[j].x,slots[j].y)});
   return {id:"MP-MAU-"+(i+1),name,level,coins,happiness,helpsGiven,clock:0,seeded:false,world:makeWorld(buildings,level)};
  });
 }

 }

  const next=new Date();next.setHours(24,0,0,0);const seconds=Math.max(0,Math.ceil((next-Date.now())/1000));
  return String(Math.floor(seconds/3600)).padStart(2,"0")+":"+String(Math.floor(seconds/60)%60).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
 }

   if((friend.clock+=dt)>=48){friend.clock-=48;this.sim.crisis.friendRoll(friend)}
  }

  return SocialStorageAdapter.code([1,p.mayorId,p.mayorName,p.level,Math.max(0,Math.floor(p.coins)),Math.round(p.happiness),p.helpsGiven,w.buildings.map(b=>[b.id,b.x,b.y,b.level])]);

 import(code){
  const data=SocialStorageAdapter.decode(code.trim());
  const within=(v,min,max)=>Number.isSafeInteger(v)&&v>=min&&v<=max;
  if(!Array.isArray(data)||data.length!==8)throw Error("Định dạng mã thành phố không được hỗ trợ.");
  const [ver,id,name,level,coins,happiness,helpsGiven,layout]=data;
  if(ver!==1||typeof id!=="string"||!/^MP-\d{4}$/.test(id)||typeof name!=="string"||!name.trim()||name.length>40||
     !within(level,1,100000)||!within(coins,0,Number.MAX_SAFE_INTEGER)||!within(happiness,20,150)||
     !within(helpsGiven,0,Number.MAX_SAFE_INTEGER)||!Array.isArray(layout)||layout.length>256)throw Error("Hồ sơ thành phố không hợp lệ.");
  if(id===this.sim.profile.mayorId)throw Error("Đây là mã thành phố của bạn.");
  const grid={unlockedRadius:CONFIG.radius(level)},used=new Set(),buildings=[];
  for(const item of layout){
   if(!Array.isArray(item)||item.length!==4)throw Error("Bố cục công trình không hợp lệ.");
   const [type,x,y,l]=item;
   if(typeof type!=="string"||!Object.hasOwn(CONFIG.buildings,type)||!within(x,0,15)||!within(y,0,15)||!within(l,1,5)||
      CONFIG.buildings[type].unlock>level||!unlocked(grid,x,y)||used.has(coord(x,y)))throw Error("Bố cục công trình không hợp lệ.");
   used.add(coord(x,y));buildings.push(makeBuilding(type,x,y,l));
  }
  const friend={id,name:name.trim(),level,coins,happiness,helpsGiven,clock:0,seeded:true,world:makeWorld(buildings,level)};
  this.adapter.add(friend);this.sim.crisis.friendRoll(friend,true);this.sim.storage.save();return friend;
 }
 rankings(stat){
  const p=this.sim.profile;
  const entries=[{id:p.mayorId,name:p.mayorName,level:p.level,coins:p.coins,happiness:p.happiness,helpsGiven:p.helpsGiven,world:this.sim.world},...this.friends()];
  const value=e=>stat==="assets"?e.coins+e.world.buildings.reduce((sum,b)=>sum+CONFIG.buildings[b.id].price*(1+Array.from({length:b.level-1},(_,i)=>1.6**(i+1)).reduce((a,b)=>a+b,0)),0):e[stat];
  return entries.map(e=>({...e,score:value(e)})).sort((a,b)=>b.score-a.score||b.level-a.level);
 }
}
class IsoRenderer {

class StorageManager {
 static fresh(){
  const buildings=[];
  for(let x=5;x<=10;x++)buildings.push(makeBuilding("road",x,7));
  for(let y=5;y<=10;y++)if(y!==7)buildings.push(makeBuilding("road",8,y));
  buildings.push(makeBuilding("house_small",7,8),makeBuilding("power_plant",6,6),makeBuilding("water_tower",9,8));
  return {
   profile:{mayorId:"MP-"+Math.floor(1000+Math.random()*9000),mayorName:"Thị trưởng Mới",level:1,xp:0,coins:CONFIG.starterCoins,prestige:10,happiness:100,combo:0,helpsGiven:0,dailyHelpsLeft:5,lastHelpResetDate:today()},
   world:makeWorld(buildings),milestones:{completedIds:[],claimedIds:[],stats:{crisesSolved:0,buildingsBuilt:0,roadsBuilt:0,peakIncome:0,npcLevel:1,policies:0,news500:false}},friends:[],lastSavedAt:0,sound:true
  };
 }
 static load(){
  const fallback=this.fresh();
  try{
   const raw=localStorage.getItem(CONFIG.key);if(!raw)return fallback;
   const val=JSON.parse(raw);
   if(!val.profile||!Number.isFinite(val.profile.coins)||!Number.isFinite(val.profile.xp)||!Number.isSafeInteger(val.profile.level)||val.profile.level<1||val.profile.level>100000||
      !Array.isArray(val.world?.buildings)||val.world.buildings.length>256||val.world.buildings.some(b=>!Object.hasOwn(CONFIG.buildings,b?.id)||!Number.isInteger(b.x)||!Number.isInteger(b.y)||!inside(b.x,b.y)))return fallback;
   return {...fallback,...val,profile:{...fallback.profile,...val.profile},world:makeWorld(val.world.buildings,val.profile.level,val.world),
    milestones:{...fallback.milestones,...val.milestones,stats:{...fallback.milestones.stats,...val.milestones?.stats}},
    friends:Array.isArray(val.friends)?val.friends:[]};
  }catch(_){return fallback}
 }
 constructor(sim){this.sim=sim;this.available=true;this.erasing=false}
 save(){
  if(this.erasing)return true;
  const {profile,world,milestones,social,audio}=this.sim;
  try{
   localStorage.setItem(CONFIG.key,JSON.stringify({profile,world,milestones,friends:social.friends(),lastSavedAt:Date.now(),sound:audio.enabled},(key,value)=>key==="index"?undefined:value));
   this.available=true;return true;
  }catch(_){this.available=false;return false}
 }
 offline(lastSavedAt){
  if(!Number.isFinite(lastSavedAt)||lastSavedAt<=0)return null;
  const seconds=Math.min((Date.now()-lastSavedAt)/1000,28800);if(seconds<60)return null;
  const {sim}=this,coins=Math.max(0,Math.floor(sim.measure(sim.world).income*seconds*.6));
  sim.profile.coins+=coins;this.save();return {coins,seconds};
 }
 reset(){
  try{this.erasing=true;localStorage.removeItem(CONFIG.key);location.reload();return true}
  catch(_){this.erasing=false;return false}
 }
}

 }
 socials(){
  const s=this.sim,list=s.social.friends().map(f=>'<div class="row"><div><b>'+htm(f.name)+'</b><small>'+f.id+' · Cấp '+f.level+' · '+f.world.crises.length+' sự cố</small></div>'+this.btn("visit","Thăm thành phố",{id:f.id,cls:"primary"})+'</div>').join("");
  this.open("social","KẾT NỐI ĐÔ THỊ","Bạn bè & Bảng xếp hạng",'<div class="tabs">'+this.btn("social","Bạn bè",{cls:"active"})+this.btn("rank","Bảng xếp hạng")+this.btn("codes","Mã thành phố")+'</div><p class="muted">Còn <b id="help-left">'+s.profile.dailyHelpsLeft+'/5</b> lượt chi viện · làm mới sau <b id="help-timer">'+s.social.resetTime()+'</b>.<br>Thưởng mỗi lượt: 250 Vàng × cấp bạn, 40 XP và 2 Uy tín.</p>'+list);
 }
 rankings(){
  const tabs=[["assets","Tổng Tài sản"],["happiness","Hạnh phúc Đô thị"],["helpsGiven","Thị trưởng Nghĩa hiệp"]];
  const rows=this.sim.social.rankings(this.rank).map((f,i)=>'<div class="row"><div><b>'+String(i+1).padStart(2,"0")+' · '+htm(f.name)+(f.id===this.sim.profile.mayorId?' <span class="mint">(Bạn)</span>':'')+'</b><small>Cấp '+f.level+' · '+f.id+'</small></div><b class="gold">'+fmt(f.score)+(this.rank==="happiness"?"%":this.rank==="assets"?" Vàng":" lượt")+'</b></div>').join("");
  this.open("rank","KẾT NỐI ĐÔ THỊ","Bảng xếp hạng Thị trưởng",'<div class="tabs">'+this.btn("social","Về Bạn bè")+tabs.map(([id,title])=>this.btn("rank",title,{id,cls:this.rank===id?"active":""})).join("")+'</div>'+rows);
 }
 codes(){
  this.open("codes","KẾT NỐI ĐÔ THỊ","Mã thành phố",'<div class="tabs">'+this.btn("social","Về Bạn bè")+'</div><label for="export-code"><b>Xuất mã thành phố</b></label><textarea id="export-code" rows="3" readonly>'+this.sim.social.export()+'</textarea>'+this.btn("copy","Sao chép mã",{cls:"primary"})+'<p></p><label for="import-code"><b>Nhập mã kết bạn</b></label><textarea id="import-code" rows="3" maxlength="28000" placeholder="Dán mã Base64 của bạn bè"></textarea>'+this.btn("import","Nhập và kết bạn",{cls:"primary"}));
 }
 settings(){
  const p=this.sim.profile;
  this.open("settings","HỒ SƠ & DỮ LIỆU","Cài đặt",'<label for="mayor-name"><b>Tên Thị trưởng</b></label><input id="mayor-name" maxlength="40" value="'+htm(p.mayorName)+'"><p class="muted">Mayor ID: <b>'+p.mayorId+'</b> · Tự động lưu mỗi 5 giây vào trình duyệt.</p><div class="tabs">'+this.btn("save","Lưu ngay",{cls:"primary"})+this.btn("sound",this.sim.audio.enabled?"Tắt âm thanh":"Bật âm thanh")+this.btn("reset","Chơi lại / Xóa bản lưu",{cls:"danger"})+'</div>');
 }
 offline(result){
  this.open("offline","THU NHẬP NGOẠI TUYẾN","Chào mừng trở lại!",'<p>Thành phố đã tự vận hành trong <b>'+timer(result.seconds)+'</b> (tối đa 8 giờ). Bạn nhận <b class="gold">+'+fmt(result.coins)+' Vàng</b> với hiệu suất ngoại tuyến 60%.</p>'+this.btn("welcome","Vào thành phố",{cls:"primary"}));
 }
 action(button){
  const s=this.sim,r=this.renderer,act=button.dataset.act,id=button.dataset.id;
  const tile=()=>{const k=Number(id);return lookup(s.world,k%16,k>>4)};
  switch(act){
   case "look":this.setTool("look");this.catalogOpen=false;break;
   case "build":if(s.social.current)return;this.catalogOpen=!this.catalogOpen;if(!this.catalogOpen)this.setTool("look");break;
   case "close-build":this.catalogOpen=false;this.setTool("look");break;
   case "filter":this.category=id;this.nodes.catalog.scrollTop=0;break;
   case "select":this.select(id);break;
   case "move":case "demo":if(!s.social.current){this.catalogOpen=false;this.setTool(this.tool===act?"look":act)}break;
   case "zoom-in":r.zoom(1.15);break;
   case "zoom-out":r.zoom(1/1.15);break;
   case "center":r.center();break;
   case "sound":s.audio.enabled=!s.audio.enabled;if(s.audio.enabled)s.audio.play("click");s.storage.save();if(this.dialogType==="settings"){button.textContent=s.audio.enabled?"Tắt âm thanh":"Bật âm thanh"}break;
   case "settings":this.settings();break;
   case "save":{
    const input=document.getElementById("mayor-name"),name=input?.value.trim();if(name)s.profile.mayorName=name;else if(input){this.toast("Tên Thị trưởng không được để trống.");return}
    this.close();this.toast(s.storage.save()?"Đã lưu thành phố.":"Không thể lưu: trình duyệt không cho phép ghi dữ liệu.");break;
   }
   case "reset":this.open("reset","XÁC NHẬN","Bắt đầu lại từ đầu?",'<p>Toàn bộ tiến độ, thành phố và danh sách bạn bè trên trình duyệt này sẽ bị xóa.</p>'+this.btn("do-reset","Xóa và chơi lại",{cls:"danger"}));break;
   case "do-reset":if(!s.storage.reset()){this.close();this.toast("Không thể xóa bản lưu trên trình duyệt này.")}break;
   case "dispatch":this.dispatch(id);break;
   case "quick":this.select(id);break;
   case "focus":if(this.inspect)r.focus(this.inspect.x,this.inspect.y);break;
   case "inspect-close":this.inspect=null;break;
   case "upgrade":if(tile())this.toast(s.upgrade(tile())||"Đã nâng cấp công trình.");break;
   case "accelerate":if(tile())this.toast(s.accelerate(tile())||"Đã xây xong!");break;
   case "remove":if(tile())this.confirmDemolish(tile());break;
   case "do-demolish":if(tile()){this.close();this.toast(s.demolish(tile())||"Đã phá dỡ công trình.");this.inspect=null}break;
   case "teams":this.teams();break;
   case "team-up":case "team-hire":if(tile()){const error=s.crisis.teamAction(tile(),act==="team-hire"?"hire":"upgrade");this.teams();if(error){this.close();this.toast(error)}}break;
   case "policies":this.policies();break;
   case "policy":{const error=s.activate(id);if(error){this.close();this.toast(error)}else this.policies();break}
   case "missions":this.missions();break;
   case "claim":s.claim(id);this.missions();break;
   case "social":this.socials();break;
   case "rank":if(id)this.rank=id;this.rankings();break;
   case "codes":this.codes();break;
   case "copy":{
    const out=document.getElementById("export-code");out.select();
    if(navigator.clipboard)navigator.clipboard.writeText(out.value).then(()=>button.textContent="Đã sao chép").catch(()=>button.textContent="Đã chọn · Ctrl+C");
    else button.textContent=document.execCommand("copy")?"Đã sao chép":"Đã chọn · Ctrl+C";
    break;
   }
   case "import":{
    const input=document.getElementById("import-code");let feedback=document.getElementById("code-message");
    if(!feedback){feedback=document.createElement("p");feedback.id="code-message";feedback.setAttribute("role","status");input.after(feedback)}
    try{const friend=s.social.import(input.value);feedback.className="mint";feedback.textContent="Đã kết bạn với "+friend.name+".";input.value=""}
    catch(error){feedback.className="warn";feedback.textContent=error.message}
    break;
   }
   case "visit":
    if(!s.social.current)this.ownCamera={...r.camera};
    s.social.visit(id);r.center();this.setTool("look");this.catalogOpen=false;r.hover=null;this.close();break;
   case "return":
    s.social.own();if(this.ownCamera)r.camera={...this.ownCamera};else r.center();r.target=null;r.hover=null;this.setTool("look");this.close();break;
   case "close-dialog":this.close();break;
   case "welcome":s.audio.play("money");this.close();break;
  }
  this.refresh();
 }
 refresh(initial=false){
  const s=this.sim,p=s.profile,w=s.social.world,friend=s.social.current,m=s.metrics,own=!friend;
  this.html("profile",'<span class="profile-avatar">'+this.icon("crew")+'</span><span class="profile-meta"><b>'+htm(p.mayorName)+'</b><small>CẤP '+p.level+' · '+fmt(p.xp)+' / '+fmt(CONFIG.xpNext(p.level))+' XP</small>'+this.bar(p.xp/CONFIG.xpNext(p.level))+'</span>');
  this.html("stats",[
   this.stat("coin","Vàng",fmt(Math.floor(p.coins)),"+"+fmt(m.income,1)+"/s","gold"),
   this.stat("gem","Uy tín",fmt(p.prestige,p.prestige%1?1:0),"","mint"),this.stat("crew","Dân số",fmt(m.pop)),
   this.stat("happy","Hạnh phúc",fmt(m.happiness)+"%","","mint"),
   this.stat("power","Điện","+"+m.ps+" / −"+m.pd,"",m.ps<m.pd?"warn":""),
   this.stat("water","Nước","+"+m.ws+" / −"+m.wd,"",m.ws<m.wd?"warn":"")
  ].join(""));
  const t=Math.floor(s.world.timeOfDay*1440),phase=t<360||t>=1140?"Đêm":t<660?"Buổi sáng":t<960?"Buổi trưa":"Hoàng hôn",weather=CONFIG.weather[s.world.weather];
  this.html("clock",'<b>'+String(Math.floor(t/60)).padStart(2,"0")+':'+String(t%60).padStart(2,"0")+' · '+phase+'</b><small>'+weather[0]+' '+weather[1]+'</small>');
  this.html("sound",this.icon(s.audio.enabled?"sound":"mute"));this.nodes.sound.setAttribute("aria-pressed",String(s.audio.enabled));
  this.html("maplabel",'<small>Bản đồ quy hoạch · '+(w.unlockedRadius*2)+' × '+(w.unlockedRadius*2)+' ô đất</small><h1>'+(own?"Thành phố của tôi":htm(friend.name))+'</h1>');
  this.nodes.visit.hidden=own;
  if(friend)this.html("visit",'<b>Đang thăm thành phố của '+htm(friend.name)+'</b>'+this.btn("return","Về thành phố của tôi"));
  const pending=s.milestones.completedIds.some(id=>!s.milestones.claimedIds.includes(id));
  this.html("dock",this.menu.map(([id,name,icon])=>this.btn(id,this.icon(icon)+name+(id==="missions"&&pending?'<sup aria-label="Có thưởng"></sup>':""),{
   cls:((id==="build"&&(this.catalogOpen||this.tool==="build"))||(id!=="build"&&this.tool===id)||(this.dialogType===id))?"active":"",
   disabled:!own&&["build","move","demo"].includes(id)
  })).join(""));
  this.nodes.side.hidden=!this.catalogOpen||!own;
  if(this.catalogOpen&&own){
   this.html("filters",Object.entries(CONFIG.groups).map(([id,name])=>this.btn("filter",name,{id,cls:this.category===id?"active":""})).join(""));
   const rows=Object.values(CONFIG.buildings).filter(d=>this.category==="all"||d.group===this.category);
   this.html("catalog",rows.map(d=>{
    const locked=p.level<d.unlock,title=d.name+" · "+d.desc+" "+d.duration+" giây xây; +"+d.income+" Vàng/giây; Điện "+d.power+"; Nước "+d.water+".";
    return this.btn("select",'<img src="'+this.thumbs[d.id]+'" alt=""><span><b>'+d.name+'</b><small>'+(locked?'🔒 Cấp '+d.unlock:CONFIG.groups[d.group]+' · '+(d.duration?d.duration+' giây':'Tức thì'))+'</small></span><span class="price gold">'+fmt(d.price)+' V</span>',{id:d.id,cls:"blueprint"+(locked?" locked":"")+(this.selection===d.id?" active":""),title});
   }).join(""));
  }
  this.inspectCard();this.sidebar();
  this.text("zoom",Math.round(this.renderer.camera.zoom*100)+"%");
  let hint="Kéo để quan sát · Cuộn để thu phóng";
  if(friend)hint="Chỉ xem · Chạm sự cố để chi viện · Còn "+p.dailyHelpsLeft+"/5 lượt";
  else if(this.tool==="build"&&this.selection)hint=CONFIG.buildings[this.selection].name+" · "+(this.selection==="road"?"Kéo vẽ đường liên tiếp":"Chạm một ô đất sáng để đặt")+" · Esc để hủy";
  else if(this.tool==="move")hint=this.moving?"Chạm ô trống để đặt lại công trình":"Chạm công trình muốn di chuyển";
  else if(this.tool==="demo")hint="Chạm công trình để phá dỡ · Hoàn lại 50% giá gốc";
  this.text("hint",hint);
  if(s.news.length&&(!this.displayedNews.includes(s.news[0])||s.elapsed-this.newsAt>=24||initial)){
   const next=!this.displayedNews.includes(s.news[0])?s.news[0]:s.news[this.newsCursor++%s.news.length];
   this.displayedNews.unshift(next);this.displayedNews.length=Math.min(this.displayedNews.length,12);
   this.text("news",next+"   •   MetroPulse — Nhịp Đập Đô Thị");
   for(const animation of this.nodes.news.getAnimations())animation.currentTime=0;
   this.newsAt=s.elapsed;
  }
  if(this.dialogType==="social"){
   const timer=document.getElementById("help-timer"),left=document.getElementById("help-left");
   if(timer)timer.textContent=s.social.resetTime();if(left)left.textContent=p.dailyHelpsLeft+"/5";
  }
  if(this.dialogType==="policies"&&this.nodes.dialog.open&&Math.floor(s.elapsed)!==this.policyFrame){this.policyFrame=Math.floor(s.elapsed);this.policies()}
 }
 inspectCard(){
  const b=this.inspect,card=this.nodes.inspect,s=this.sim;
  if(!b||!s.social.world.buildings.includes(b)){card.hidden=true;return}
  card.hidden=false;
  const d=CONFIG.buildings[b.id],key=coord(b.x,b.y),team=CONFIG.npcs[b.id],w=s.social.world;
  let actions="";
  if(!s.social.current){
   actions=(b.left>0?this.btn("accelerate","Tăng tốc · 1 UT",{id:key,cls:"primary"}):this.btn("upgrade",b.level>=5?"Cấp tối đa":"Nâng cấp · "+fmt(CONFIG.upgrade(b))+" V",{id:key,cls:"primary",disabled:b.level>=5}))+
    (team?this.btn("teams","Quản lý đội"):"")+this.btn("remove","Phá dỡ",{id:key,cls:"danger"});
  }
  this.html("inspect",'<div style="display:flex;justify-content:space-between;align-items:start;gap:5px"><div><div class="eyebrow">'+CONFIG.groups[d.group]+'</div><h3>'+d.name+'</h3></div>'+this.btn("inspect-close","×",{cls:"ghost icon",title:"Đóng thẻ"})+'</div><small>Ô '+String.fromCharCode(65+b.x)+(b.y+1)+' · Cấp '+b.level+'</small><p class="muted" style="font-size:11px;margin-top:5px">'+d.desc+'</p>'+
   (b.left>0?'<small>Đang xây · '+Math.ceil(b.left)+' giây</small>'+this.bar(1-b.left/b.total):'<small class="gold">+'+fmt(s.production(b,w),1)+' V/s</small><small> · Điện '+(d.power>0?"+":"")+d.power+' · Nước '+(d.water>0?"+":"")+d.water+' · Rác '+(d.waste>0?"+":"")+d.waste+(d.pop?' · +'+d.pop+' Dân':'')+'</small>')+'<div class="actions">'+actions+'</div>');
 }
 sidebar(){
  const s=this.sim,w=s.social.world,friend=s.social.current;
  let result=w.crises.map(c=>{
   const d=CONFIG.crises[c.id],job=w.npcs.find(n=>n.target===c.uid&&n.phase!=="return"),teams=s.crisis.teams(d.hq);
   let status=job?(job.blocked?"Đang chờ mở lối":c.progress>0?"Đang sửa · "+Math.round(c.progress*100)+"%":"Đội đang trên đường"):c.late?"Quá ngưỡng nguy hiểm":"Nguy hiểm sau "+Math.max(0,Math.ceil(d.danger-c.age))+" giây";
   if(!teams.length&&!job)status="Cần xây "+CONFIG.buildings[d.hq].name+" để điều phối "+d.npc+"!";
   const button=job?this.btn("dispatch","Đang điều phối",{id:c.uid,disabled:true}):this.btn("dispatch",friend?"Chi viện NPC":"Điều phối NPC",{id:c.uid,cls:"primary"});
   return '<div class="incident glass interactive"><div class="eyebrow">'+htm(d.icon)+' · '+(friend?"Sự cố thành phố bạn":"Cảnh báo sự cố")+'</div><h3>'+d.name+'</h3><p>'+d.penalty+'</p><small>'+status+'</small>'+this.bar(job&&c.progress>0?c.progress:c.age/d.danger,job?"blue":"danger")+button+
    (!teams.length&&!friend?this.btn("quick","Xây nhanh Trụ sở",{id:d.hq}):"")+'</div>';
  }).join("");
  if(!friend&&!result){
   const goal=CONFIG.milestones.find(m=>!s.milestones.claimedIds.includes(m.id));
   if(goal){
    const ready=s.milestones.completedIds.includes(goal.id);
    result='<div class="mission glass interactive"><div class="eyebrow">◆ Lộ trình Thị trưởng</div><h3>'+goal.name+'</h3><p>'+goal.desc+'</p>'+
     (goal.id==="roots"?this.bar((Math.min(2,s.count("house_small"))+Math.min(1,s.count("power_plant")))/3):"")+
     this.btn(ready?"claim":"missions",ready?"Nhận thưởng":"Xem nhiệm vụ",{cls:ready?"primary":"",id:goal.id})+'</div>';
   }
  }
  this.html("right",result);
 }
}

const audio=new AudioEngine(),data=StorageManager.load();
audio.enabled=data.sound!==false;
const sim=new SimulationEngine(data,audio);
sim.crisis=new CrisisAndNPCManager(sim);
sim.social=new SocialManager(sim,data.friends);
sim.storage=new StorageManager(sim);
const renderer=new IsoRenderer(document.getElementById("map"),sim),ui=new UIController(sim,renderer);
sim.refreshMilestones();
const offline=sim.storage.offline(data.lastSavedAt);
if(offline)ui.offline(offline);else sim.storage.save();
addEventListener("pagehide",()=>sim.storage.save());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")sim.storage.save()});
sim.start(renderer,ui);
</script>
</body>
</html>
