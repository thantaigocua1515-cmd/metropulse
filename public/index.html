<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<meta name="description" content="MetroPulse — Nhịp Đập Đô Thị: game xây dựng thành phố isometric, xử lý sự cố theo thời gian thực.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122120'/%3E%3Cpath d='M8 37h11l7-19 11 30 7-11h12' fill='none' stroke='%23d1fb8b' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>MetroPulse · Nhịp Đập Đô Thị</title>
<meta name="mp-release" content="4.7.3">
<link rel="preload" href="fonts/be-vietnam-pro-400-latin.woff2?v=4.7.3" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/be-vietnam-pro-400-vietnamese.woff2?v=4.7.3" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=4.7.3">
<script>
const bootHealth=location.protocol!=="file:"&&navigator.onLine?(()=>{
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
 return fetch("api/health",{cache:"no-store",signal:controller.signal}).then(res=>res.ok,()=>false).finally(()=>clearTimeout(timer));
})():null;
</script>
<script defer src="js/config.js?v=4.7.3"></script>
<script defer src="js/sprites.js?v=4.7.3"></script>
<script defer src="js/skin-sprites.js?v=4.7.3"></script>
<script defer src="js/content.js?v=4.7.3"></script>
<script defer src="js/audio.js?v=4.7.3"></script>
<script defer src="js/core.js?v=4.7.3"></script>
<script defer src="js/art-data.js?v=4.7.3"></script>
<script defer src="js/art.js?v=4.7.3"></script>
<script defer src="js/simulation.js?v=4.7.3"></script>
<script defer src="js/crisis.js?v=4.7.3"></script>
<script defer src="js/progression.js?v=4.7.3"></script>
<script defer src="js/social.js?v=4.7.3"></script>
<script defer src="js/citylife.js?v=4.7.3"></script>
<script defer src="js/effects.js?v=4.7.3"></script>
<script defer src="js/events.js?v=4.7.3"></script>
<script defer src="js/renderer.js?v=4.7.3"></script>
<script defer src="js/storage.js?v=4.7.3"></script>
<script defer src="js/cloud.js?v=4.7.3"></script>
<script defer src="js/auth.js?v=4.7.3"></script>
<script defer src="js/ui-input.js?v=4.7.3"></script>
<script defer src="js/ui.js?v=4.7.3"></script>
<script defer src="js/ui-dialogs.js?v=4.7.3"></script>
<script defer src="js/ui-community.js?v=4.7.3"></script>
<script defer src="js/tutorial.js?v=4.7.3"></script>
<script defer src="js/main.js?v=4.7.3"></script>
</head>
<body>
<canvas id="map" aria-label="Bản đồ đẳng phối thành phố"></canvas>
<div id="hud">
 <header class="topbar">
  <button id="profile" class="profile" data-act="profile" data-id="me" title="Hồ sơ Thị trưởng"></button>
  <div id="stats" class="stats" aria-label="Chỉ số đô thị"></div>
 </header>
 <div class="city-sign"><div id="maplabel" class="maplabel"></div><div id="clock" class="clock"></div></div>
 <div id="event-banner" class="event-banner" hidden></div>
 <div id="utilities" class="utilities" aria-label="Tiện ích thành phố"></div>
 <nav id="command-rail" class="command-rail" aria-label="Điều hành">
  <button id="rail-toggle" class="game-btn round rail-toggle" data-act="rail-toggle" aria-expanded="false" aria-controls="command-drawer" aria-label="Mở chức năng" title="Mở chức năng"></button>
  <div id="command-drawer" class="rail-drawer" inert>
   <div id="action-rail" class="rail-main"></div>
   <div class="rail-system">
    <button id="settings" class="game-btn round" data-act="profile" data-id="settings" aria-label="Cài đặt" title="Cài đặt"></button>
    <button id="cloud" class="game-btn round" data-act="profile" data-id="account"></button>
    <button id="sound" class="game-btn round" data-act="sound" aria-label="Âm thanh" title="Âm thanh"></button>
    <button id="help" class="game-btn round" data-act="help" aria-label="Cẩm nang Thị trưởng" title="Cẩm nang Thị trưởng"></button>
   </div>
  </div>
 </nav>
 <div id="visit" class="visit interactive" hidden></div>
 <section id="side" class="side game-frame interactive" aria-label="Danh mục xây dựng" hidden>
  <div class="side-header"><h2>Kho bản vẽ</h2><div id="filters" class="filter"></div><button class="frame-close" data-act="close-build" aria-label="Đóng bản vẽ"><svg aria-hidden="true" viewBox="0 0 64 64" data-hud-art="close"><use href="img/hud.svg?v=4.7.3#close"/></svg></button></div>
  <div id="catalog" class="catalog"></div>
 </section>
 <aside class="alerts" aria-label="Tình hình thành phố"><div id="right" class="right"></div><div id="quest-track"></div></aside>
 <section id="inspect" class="inspect game-frame interactive" hidden></section>
 <div id="fab" class="fab"></div>
 <nav id="build-tools" class="build-tools" aria-label="Công cụ xây dựng"></nav>
 <div class="camera">
 <aside id="incidents" class="incidents" aria-label="Sự cố đang diễn ra"></aside>
 <nav class="camera-controls" aria-label="Điều khiển bản đồ">
  <div class="lens"><button class="game-btn round" data-act="zoom-out" aria-label="Thu nhỏ" title="Thu nhỏ"><svg aria-hidden="true" viewBox="0 0 64 64" data-hud-art="minus"><use href="img/hud.svg?v=4.7.3#minus"/></svg></button><output id="zoom">100%</output><button class="game-btn round" data-act="zoom-in" aria-label="Phóng to" title="Phóng to"><svg aria-hidden="true" viewBox="0 0 64 64" data-hud-art="plus"><use href="img/hud.svg?v=4.7.3#plus"/></svg></button></div>
  <div class="camera-main"><button class="game-btn round" data-act="look" id="look" aria-label="Chế độ quan sát" title="Chế độ quan sát"></button><button class="game-btn round" data-act="center" id="center" aria-label="Về giữa bản đồ" title="Về giữa bản đồ"></button></div>
 </nav>
 </div>
 <div id="hint" class="hint"></div>
 <div id="toast" class="toast glass" role="status" hidden></div>
 <div id="coach" class="coach" hidden></div>
 <footer class="bottom"><div class="news"><b>BẢN TIN</b><div class="news-window"><span id="news"></span></div></div></footer>
</div>
<div id="scene" class="scene" hidden><div id="scene-body" class="scene-body"></div></div>
<dialog id="dialog" class="game-frame" aria-labelledby="dialog-title"><div class="dialog-head frame-header"><div><div id="dialog-tag" class="eyebrow"></div><h2 id="dialog-title"></h2></div><button class="frame-close" data-act="close-dialog" aria-label="Đóng hộp thoại"><svg aria-hidden="true" viewBox="0 0 64 64" data-hud-art="close"><use href="img/hud.svg?v=4.7.3#close"/></svg></button></div><div id="dialog-body" class="dialog-body"></div></dialog>
<div id="auth" class="auth" data-art-bg="background-login" hidden>
 <form id="auth-form" class="auth-card game-frame" novalidate>
  <div class="auth-brand frame-header"><svg aria-hidden="true" viewBox="0 0 64 64" data-hud-art="pulse"><use href="img/hud.svg?v=4.7.3#pulse"/></svg><div><b>MetroPulse</b><small>Nhịp Đập Đô Thị</small></div></div>
  <div class="auth-fields">
  <img class="portrait auth-face" alt="" width="76" height="76">
  <p class="auth-lead">Đăng nhập để chơi tiếp thành phố của bạn trên mọi thiết bị.</p>
  <div class="tabs" role="tablist"><button type="button" data-mode-tab="login" role="tab">Đăng nhập</button><button type="button" data-mode-tab="register" role="tab">Đăng ký</button></div>
  <label>Tên đăng nhập<input id="gate-user" name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="3–20 ký tự: chữ, số, dấu chấm, gạch dưới"></label>
  <label>Mật khẩu<input id="gate-pass" name="password" type="password" maxlength="72" autocomplete="current-password" placeholder="Từ 6 ký tự"></label>
  <label id="gate-again-row" hidden>Nhập lại mật khẩu<input id="gate-again" type="password" maxlength="72" autocomplete="new-password"></label>
  <label class="check"><input id="gate-show" type="checkbox"> Hiện mật khẩu</label>
  <p id="gate-message" role="status" aria-live="polite"></p>
  <button id="gate-submit" type="submit" class="primary block">Đăng nhập</button>
  <small id="gate-note"></small>
  <div class="auth-or"><span>hoặc</span></div>
  <button id="gate-guest" type="button" class="block">Chơi ngay không cần tài khoản</button>
  <small>Chơi khách vẫn được lưu; bạn có thể tạo tài khoản sau trong Hồ sơ → Tài khoản.</small>
  </div>
 </form>
</div>
<div id="boot" class="boot" data-art-bg="background-loading">
 <div><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 37h11l7-19 11 30 7-11h12"/></svg>
 <b>MetroPulse</b><small>Nhịp Đập Đô Thị</small>
 <progress id="boot-progress" max="4" value="1" aria-label="Tiến độ mở thành phố"></progress>
 <p id="boot-status" role="status">Đang tải trò chơi…</p></div>
</div>
</body>
</html>
