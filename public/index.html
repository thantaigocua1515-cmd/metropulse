<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<meta name="description" content="MetroPulse — Nhịp Đập Đô Thị: game xây dựng thành phố isometric, xử lý sự cố theo thời gian thực.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122120'/%3E%3Cpath d='M8 37h11l7-19 11 30 7-11h12' fill='none' stroke='%23d1fb8b' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>MetroPulse · Nhịp Đập Đô Thị</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="map" aria-label="Bản đồ đẳng phối thành phố"></canvas>
<div id="hud">
 <header class="topbar">
  <button id="profile" class="profile" data-act="profile" data-id="me" title="Hồ sơ Thị trưởng"></button>
  <div id="stats" class="stats" aria-label="Chỉ số đô thị"></div>
 </header>
 <div class="city-sign"><div id="maplabel" class="maplabel"></div><div id="clock" class="clock"></div></div>
 <div id="utilities" class="utilities" aria-label="Tiện ích thành phố"></div>
 <nav class="command-rail" aria-label="Điều hành">
  <div id="action-rail" class="rail-main"></div>
  <div class="rail-system">
   <button id="settings" class="game-btn round" data-act="profile" data-id="settings" aria-label="Cài đặt" title="Cài đặt"></button>
   <button id="cloud" class="game-btn round" data-act="profile" data-id="account"></button>
   <button id="sound" class="game-btn round" data-act="sound" aria-label="Âm thanh" title="Âm thanh"></button>
   <button id="help" class="game-btn round" data-act="help" aria-label="Cẩm nang" title="Cẩm nang Thị trưởng"></button>
  </div>
 </nav>
 <div id="visit" class="visit interactive" hidden></div>
 <section id="side" class="side game-frame interactive" aria-label="Danh mục xây dựng" hidden>
  <div class="side-header frame-header"><div><div class="eyebrow">Quy hoạch đô thị</div><h2>Kho bản vẽ</h2></div><button class="frame-close" data-act="close-build" aria-label="Đóng bản vẽ">×</button></div>
  <div id="filters" class="filter"></div><div id="catalog" class="catalog"></div>
  <div class="side-foot">Chọn bản vẽ rồi chạm ô đất sáng để đặt.</div>
 </section>
 <aside class="alerts" aria-label="Tình hình thành phố"><div id="right" class="right"></div><div id="quest-track"></div></aside>
 <section id="inspect" class="inspect game-frame interactive" hidden></section>
 <div id="fab" class="fab"></div>
 <nav id="build-tools" class="build-tools" aria-label="Công cụ xây dựng"></nav>
 <nav class="camera" aria-label="Điều khiển bản đồ">
  <div class="lens"><button class="game-btn round" data-act="zoom-out" aria-label="Thu nhỏ" title="Thu nhỏ">−</button><output id="zoom">100%</output><button class="game-btn round" data-act="zoom-in" aria-label="Phóng to" title="Phóng to">+</button></div>
  <div class="camera-main"><button class="game-btn round" data-act="look" id="look" aria-label="Quan sát" title="Quan sát"></button><button class="game-btn round" data-act="center" id="center" aria-label="Về giữa bản đồ" title="Về giữa bản đồ"></button></div>
 </nav>
 <div id="hint" class="hint"></div>
 <div id="toast" class="toast glass" role="status" hidden></div>
 <div id="coach" class="coach" hidden></div>
 <footer class="bottom"><div class="news"><b>BẢN TIN</b><div class="news-window"><span id="news"></span></div></div></footer>
</div>
<div id="scene" class="scene" hidden><div id="scene-body" class="scene-body"></div></div>
<dialog id="dialog" class="game-frame" aria-labelledby="dialog-title"><div class="dialog-head frame-header"><div><div id="dialog-tag" class="eyebrow"></div><h2 id="dialog-title"></h2></div><button class="frame-close" data-act="close-dialog" aria-label="Đóng hộp thoại">×</button></div><div id="dialog-body" class="dialog-body"></div></dialog>
<div id="auth" class="auth" hidden>
 <form id="auth-form" class="auth-card game-frame" novalidate>
  <div class="auth-brand frame-header"><svg aria-hidden="true" viewBox="0 0 64 64"><use href="img/hud.svg#pulse"/></svg><div><b>MetroPulse</b><small>Nhịp Đập Đô Thị</small></div></div>
  <div class="auth-fields">
  <img class="portrait auth-face" src="img/npc/02.webp" alt="" width="76" height="76">
  <p class="auth-lead">Đăng nhập để chơi tiếp thành phố của bạn trên mọi thiết bị.</p>
  <div class="tabs" role="tablist"><button type="button" data-mode-tab="login" role="tab">Đăng nhập</button><button type="button" data-mode-tab="register" role="tab">Đăng ký</button></div>
  <label>Tên đăng nhập<input id="gate-user" name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="3–20 ký tự: chữ, số, dấu chấm, gạch dưới"></label>
  <label>Mật khẩu<input id="gate-pass" name="password" type="password" maxlength="72" autocomplete="current-password" placeholder="Từ 6 ký tự"></label>
  <label id="gate-again-row" hidden>Nhập lại mật khẩu<input id="gate-again" type="password" maxlength="72" autocomplete="new-password"></label>
  <label class="check"><input id="gate-show" type="checkbox"> Hiện mật khẩu</label>
  <p id="gate-message" role="status" aria-live="polite"></p>
  <button id="gate-submit" type="submit" class="primary block">Đăng nhập</button>
  <small id="gate-note"></small>
  <div class="auth-or"><span>hoặc</span></div>
  <button id="gate-guest" type="button" class="block">Chơi ngay không cần tài khoản</button>
  <small>Chơi khách vẫn được lưu; bạn có thể tạo tài khoản sau trong Hồ sơ → Tài khoản.</small>
  </div>
 </form>
</div>
<div id="boot" class="boot"><div><b>MetroPulse</b><small>Đang mở cổng thành phố…</small></div></div>
<script src="js/config.js"></script>
<script src="js/sprites.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/core.js"></script>
<script src="js/simulation.js"></script>
<script src="js/crisis.js"></script>
<script src="js/progression.js"></script>
<script src="js/social.js"></script>
<script src="js/citylife.js"></script>
<script src="js/renderer.js"></script>
<script src="js/storage.js"></script>
<script src="js/cloud.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui-input.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-dialogs.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
